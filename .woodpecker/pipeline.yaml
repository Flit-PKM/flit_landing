when:
  event: [push, tag, deployment]
  branch: [main]

steps:
  deploy:
    image: alpine:3.21
    volumes:
      - /var/www/flit_landing:/target
    commands:
      - apk add --no-cache git rsync
      - rm -rf /tmp/deploy
      - git clone --depth 1 https://github.com/Flit-PKM/flit_landing.git /tmp/deploy
      - rsync -av --delete /tmp/deploy/ /target/
      - echo Deployed successfully at $(date -u)

  reload-nginx:
    image: alpine:3.21
    commands:
      - apk add --no-cache curl
      - echo Reloading nginx
      - curl -X POST --unix-socket /run/nginx/nginx.sock http://localhost/reload || true