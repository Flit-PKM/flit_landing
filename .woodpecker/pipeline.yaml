when:
  event: [push, tag, deployment]
  branch: [main]               # only main branch — adjust if needed

steps:
  deploy:
    image: alpine:3.21
    volumes:
      - /var/www/flit_landing:/target
    commands:
      - apk add --no-cache git
      - git config --global --add safe.directory /target
      - cd /target
      - |
        if [ ! -d .git ]; then
          git init
          git remote add origin https://github.com/Flit-PKM/flit_landing.git
        fi
      - git fetch --all --prune --force
      - git checkout -f origin/main
      - git clean -fdx
      - echo "Deployed at $(date -u)"

  notify-or-reload:
    image: alpine:3.21
    commands:
      - echo "Reload nginx if needed"
      - apk add --no-cache curl
      - curl -X POST --unix-socket /run/nginx/nginx.sock http://localhost/reload || true