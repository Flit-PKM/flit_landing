when:
  event: [push, pull_request]
  branch: [main]

steps:
  deploy:
    image: alpine:3.21
    volumes:
      - /var/www/flit_landing:/target
    commands:
      - apk add --no-cache rsync
      - rsync -av --delete . /target/   # . = the already-cloned repo
      - echo "Deployed at $(date -u)"

  reload-nginx:
    image: nginx:alpine   # tiny image that contains the exact `nginx -s reload` binary
    pid_mode: host
    volumes:
      - /run:/run:ro
      - /var/run:/var/run:ro
    commands:
      - nginx -s reload
      - echo "✅ Nginx reloaded at $(date -u)"