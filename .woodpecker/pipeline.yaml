when:
  event: [push, pull_request]
  branch: [main]

steps:
  deploy:
    image: alpine:3.21
    volumes:
      - /var/www/flit_landing:/target
    commands:
      - apk add --no-cache rsync
      - rsync -av --delete . /target/
      - echo "Deployed at $(date -u)"

  reload-nginx:
    image: nginx:alpine
    privileged: true
    volumes:
      - /run:/run:ro
      - /var/run:/var/run:ro
    commands:
      - nginx -s reload || (echo "Reload failed - attempting full restart" && nginx -s stop && nginx)
      - echo "Reload attempted at $(date -u)"