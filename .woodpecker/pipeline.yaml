when:
  event: [push, pull_request]
  branch: [main]

steps:
  deploy:
    image: alpine:3.21
    volumes:
      - /var/www/flit_landing:/target
    commands:
      - apk add --no-cache rsync
      - rsync -av --delete . /target/
      - echo "Deployed at $(date -u)"

  reload-nginx:
    image: alpine:3.21
    privileged: true
    pid: host
    commands:
      - nsenter -t 1 -m -u -i -n /usr/bin -c "systemctl reload nginx"
      - echo "✅ Reload attempted at $(date -u)"