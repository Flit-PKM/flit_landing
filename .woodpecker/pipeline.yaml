when:
  event: [push, pull_request]
  branch: [main]

steps:
  deploy:
    image: alpine:3.21
    volumes:
      - /var/www/flit_landing:/target
    commands:
      - apk add --no-cache rsync
      - rsync -av --delete . /target/
      - echo "Deployed at $(date -u)"

  reload-nginx:
    image: alpine:3.21
    privileged: true
    volumes:
      - /home/ubuntu/woodpecker/nginx-reload:/home/ubuntu/woodpecker/nginx-reload
    commands:
      - ls -la /home/ubuntu/woodpecker/nginx-reload
      - nsenter -t 1 -u -i -n -- /home/ubuntu/woodpecker/nginx-reload