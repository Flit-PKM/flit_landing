when:
  event: [push, pull_request]
  branch: [main]

steps:
  validate:
    image: node:22-alpine
    commands:
      - npm install -g html-validate@9
      - html-validate index.html

  deploy:
    image: alpine:3.21
    volumes:
      - /var/www/flit_landing:/target
    commands:
      - apk add --no-cache rsync
      - rsync -av --delete . /target/
      - echo "Deployed at $(date -u)"
