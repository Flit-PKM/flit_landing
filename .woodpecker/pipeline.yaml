when:
  event: [push, pull_request]
  branch: [main]

steps:
  deploy:
    image: alpine:3.21
    volumes:
      - /var/www/flit_landing:/target
    commands:
      - apk add --no-cache rsync
      - rsync -av --delete . /target/   # . = the already-cloned repo
      - echo "Deployed at $(date -u)"

  reload-nginx:
    image: alpine:3.21
    commands:
      - apk add --no-cache curl
      - curl -X POST --unix-socket /run/nginx/nginx.sock http://localhost/reload || true